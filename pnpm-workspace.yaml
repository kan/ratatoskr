packages:
  - 'web'
allowBuilds:
  esbuild: true
  workerd: true
# @cloudflare/vitest-pool-workers 0.23.0 が miniflare を完全一致で固定しており、その先の
# sharp 0.35.2 が libheif の脆弱性（GHSA-rgj7-g3m4-5g8c）と librsvg の脆弱性
# （GHSA-wq5f-xc86-pv6w）に当たる。dependabot では上げられないので、修正版へ寄せる。
# pool-workers が 0.35.5 以上の sharp を引く miniflare を使うようになったら外す
#
# undici も同じ経路（pool-workers 0.23.0 → miniflare 5.20260815 が 7.29.0 に完全一致で固定）で
# 修正版に届かない（GHSA-w293-vg96-wgc3 ほか。2026-11 には 7.30.1 で直った 5 件が加わった）。
# pool-workers が 7.30.1 以上の miniflare を引くようになったら外す
overrides:
  'sharp@<0.35.5': '0.35.5'
  'undici@>=7.0.0 <7.30.1': '7.30.1'
