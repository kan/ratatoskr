<!--
  Android 13 以降の「テーマ アイコン」用（manifest の purpose: monochrome）。

  **色を持たず、形だけを渡す。** ランチャーが壁紙に合わせて塗り直すので、
  地色は透明にして図柄だけを不透明で置く（塗りの色そのものは使われない）。
  これが無いと、他のアプリが単色化される中でこのアプリだけ色付きのまま浮く。

  切り抜かれるのは maskable と同じなので、余白の取り方も揃える（外側 10%）。

  PNG は scripts/build-icons.mjs で書き出す（pnpm icons）。
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  width="120"
  height="120"
  role="img"
  aria-label="Ratatoskr"
>
  <title>Ratatoskr</title>
  <clipPath id="frame"><rect x="12" y="12" width="96" height="96" /></clipPath>
  <g clip-path="url(#frame)" transform="translate(12 12)" fill="#000000" stroke="#000000">
    <rect x="-12" y="-16" width="34" height="128" stroke="none" />
    <g fill="none" stroke-width="9" stroke-linecap="round">
      <path d="M22 30 L34 19" />
      <path d="M22 66 L33 76" />
    </g>
    <g fill="none" stroke-width="7.5" stroke-linecap="round">
      <path d="M52 53 A19 19 0 0 1 71 72" />
      <path d="M52 39 A33 33 0 0 1 85 72" />
    </g>
    <circle cx="52" cy="72" r="7.5" stroke="none" />
  </g>
</svg>
