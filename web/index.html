<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--
      SVG を主にする。拡大縮小で潰れず、1 ファイルで全ての大きさに効く。
      Safari は SVG の favicon を当てにできないので PNG も置く（対応している
      ブラウザは type で SVG を選ぶ）。図柄は透過背景で、明暗どちらのタブでも沈まない。

      ホーム画面のアイコン（apple-touch-icon / manifest）は背景色付きの
      icon-brand.svg から起こした PNG を使う。透過のままだと、ホーム画面の
      壁紙に図柄が沈む
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <!--
      ホーム画面に追加したときの見え方（M8）。iOS は manifest のアイコンを見ないので
      apple-touch-icon を別に置く。標準ブラウザから追加されることが前提の設計なので、
      ここが欠けるとスマホ側の体験がそのまま欠ける
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ratatoskr" />
    <!--
      アドレスバーとステータスバーの色。画面の地色（bg-white / dark:bg-neutral-950）に
      合わせる。manifest の theme_color は 1 色しか持てない。

      **media 付きで出し分けない。** テーマは手動でも選べるので（lib/theme.ts）、
      システム設定を見る指定のままだと、選択と食い違ったときにここだけずれる。
      値は下のスクリプトと lib/theme.ts が書き換える
    -->
    <meta name="theme-color" content="#ffffff" />
    <!--
      **保存済みのテーマを、最初の描画より前に当てる。**
      アプリの読み込みを待つと、システムと違う設定にしている人は起動のたびに
      一瞬だけ逆のテーマを見ることになる。

      キー名と地色は web/src/lib/prefs.ts / lib/theme.ts が正。ここは同じ値を
      持たざるを得ない（import できない位置なので）ので、食い違っていないことを
      web/src/lib/theme.test.ts で突き合わせている。
    -->
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('ratatoskr.theme');
        } catch {
          // プライベートウィンドウ等で読めないことがある。その場合はシステムに従う
        }
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0a0a0a' : '#ffffff');
      })();
    </script>
    <title>Ratatoskr</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
